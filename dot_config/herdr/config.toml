onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#cba6f7"
panel_bg = "reset"
sidebar_bg = "#181825"
active_row_bg = "#313244"
selection_bg = "#45475a"
surface0 = "#313244"
surface1 = "#45475a"
surface_dim = "#11111b"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
text = "#cdd6f4"
subtext0 = "#a6adc8"
mauve = "#cba6f7"
green = "#a6e3a1"
yellow = "#f9e2af"
red = "#f38ba8"
blue = "#89b4fa"
teal = "#94e2d5"
peach = "#fab387"

[terminal]
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[ui]
accent = "#cba6f7"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
status_indicators = "symbols"
sidebar_max_width = 48
pane_borders = true
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
tab_bar_position = "top"
window_title = "{workspace} · {tab}"
tab_bar_right_separator = " · "

[[ui.tab_bar_right]]
type = "zoom"

[[ui.tab_bar_right]]
type = "datetime"
format = "%a %d %b %H:%M"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "terminal"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[keys]
prefix = "ctrl+b"

split_vertical = ["prefix+v", "alt+d"]
split_horizontal = ["prefix+minus", "alt+shift+d"]
zoom = ["prefix+z", "alt+shift+enter"]
copy_mode = ["prefix+[", "alt+v"]

new_tab = ["prefix+c", "alt+m"]
next_tab = ["prefix+n", "alt+backtick"]
previous_tab = ["prefix+p", "alt+shift+backtick"]
switch_tab = ["prefix+1..9", "alt+1..9"]
rename_tab = ["prefix+shift+t", "alt+shift+r"]

new_workspace = ["prefix+shift+n", "alt+n"]
rename_workspace = ["prefix+shift+w", "alt+r"]
workspace_picker = ["prefix+w", "alt+o"]
goto = ["prefix+g", "alt+w"]
next_workspace = "alt+tab"
previous_workspace = "alt+shift+tab"
switch_workspace = "prefix+shift+1..9"

focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = ["alt+g", "prefix+alt+g"]
type = "popup"
command = "lazygit"
description = "lazygit"
width = "70%"
height = "80%"

[[keys.command]]
key = ["alt+t", "prefix+t"]
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "56%"
height = "64%"

[[keys.command]]
key = ["alt+i", "prefix+i"]
type = "popup"
command = "MDR_HEIGHT=100% $HOME/.bin/mdr"
description = "reader (all/docs/scratch/files)"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+?"
type = "popup"
command = "$HOME/.bin/keys"
description = "keybindings cheatsheet"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+semicolon"
type = "popup"
command = "$HOME/.config/herdr/scripts/menu.sh"
description = "command menu"
width = "56%"
height = "60%"

[[keys.command]]
key = "alt+u"
type = "popup"
command = "$HOME/.config/herdr/scripts/url-picker.sh"
description = "pick a URL from this pane"
width = "56%"
height = "60%"

[[keys.command]]
key = "alt+f"
type = "popup"
command = "$HOME/.config/herdr/scripts/follow.sh"
description = "run a command in a new pane and hand it to the agent"
width = "60%"
height = "20%"

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true
