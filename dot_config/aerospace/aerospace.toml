config-version = 2

after-startup-command = ['exec-and-forget /opt/homebrew/bin/sketchybar']

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

start-at-login = true
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-mode-changed = [
  'exec-and-forget /bin/bash -c "/opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=$(/opt/homebrew/bin/aerospace list-modes --current)"',
]

persistent-workspaces = ['1', '2', '3', '4', '5']


[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.right = 12
outer.top = 12
outer.bottom = 60

# Key tiers: h/j/k/l = focus, shift+h/j/k/l = move within the tree,
# arrows = join, shift+arrows = monitor. Service mode holds only the rare and
# the destructive.
[mode.main.binding]
# Disable macOS hide: aerospace moves workspace-inactive windows off-screen
# instead of hiding; cmd-h breaks that bookkeeping.
# https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
cmd-h = []
cmd-alt-h = []

# Focus
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

# Move the window within the workspace tree
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

# Join the focused window with its neighbour under a common parent
ctrl-alt-left = 'join-with left'
ctrl-alt-down = 'join-with down'
ctrl-alt-up = 'join-with up'
ctrl-alt-right = 'join-with right'

# Send the window to the previous / next monitor, cycling at the ends
ctrl-alt-shift-left = 'move-node-to-monitor prev --wrap-around --focus-follows-window'
ctrl-alt-shift-right = 'move-node-to-monitor next --wrap-around --focus-follows-window'

ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'

ctrl-alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
ctrl-alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
ctrl-alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
ctrl-alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
ctrl-alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'

ctrl-alt-tab = 'workspace-back-and-forth'
ctrl-alt-leftSquareBracket = 'workspace prev'
ctrl-alt-rightSquareBracket = 'workspace next'

# Layout
ctrl-alt-enter = 'fullscreen'
ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'
# Windows float by default (see the rules below); this is the escape hatch that
# pulls one into the tiling tree, and back out again.
ctrl-alt-f = 'layout floating tiling'
# Reset: pull the focused window back into the tiling tree, then collapse that
# tree to a flat row. The first step exists because windows float by default
# here (catch-all rule below) and flatten-workspace-tree only touches the tiling
# tree — on a floating window the bare reset is a silent no-op.
# Scope caveat: `layout tiling` acts on the FOCUSED window only. AeroSpace has no
# all-windows-in-workspace form (`--root` rejects tiling/floating), so a
# workspace of floaters still needs one reset per window.
ctrl-alt-shift-r = ['layout tiling', 'flatten-workspace-tree']
ctrl-alt-c = [
  'layout floating',
  'exec-and-forget ~/.config/aerospace/scripts/place-window.sh center',
]
ctrl-alt-r = [
  'layout floating',
  'exec-and-forget ~/.config/aerospace/scripts/place-window.sh cycle',
]
ctrl-alt-minus = 'resize smart -50'
ctrl-alt-equal = 'resize smart +50'
ctrl-alt-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# ── Window rules ────────────────────────────────────────────────────────────
# Floating is the default (catch-all at the bottom). Tiling is an allowlist:
# only apps that live on a workspace all day are tiled there.
#
# AeroSpace runs the FIRST matching rule and stops, so order is load-bearing.
# Any new "app X belongs on workspace N" rule must go ABOVE the catch-all.

# Float, but keep their own position — these place themselves deliberately.
[[on-window-detected]]
if = '''
test %{app-bundle-id} = com.sindresorhus.Dato \
  || test %{app-bundle-id} = com.apple.ScreenContinuity
'''
run = 'layout floating'

# Workspace 1: Claude — tiled
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 1'

# Workspace 2: Helium — tiled
[[on-window-detected]]
if = 'test %{app-bundle-id} = net.imput.helium'
run = 'move-node-to-workspace 2'

# Workspace 3: Development — tiled
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
run = 'move-node-to-workspace 3'

# Workspace 3: VS Code — floating, because it runs macOS native tabs
# ("window.nativeTabs": true). Every tab is a distinct AXWindow, so AeroSpace
# registers it as its own node and hands it a tile — but only the frontmost tab
# of a group has a visible surface. Tiled, an N-tab window therefore eats N
# slots and the one you can see shrinks to 1/N. Measured on this monitor:
# 2 Ghostty + 2 Code tabs = 4 tiles of 625px, with the second Code tile a blank
# 622px hole at x=1286. Floating, the phantom nodes cost no tiling slot and
# Ghostty gets the full split back.
# Upstream: AeroSpace#68 (open, 1.0-blocker) — no fix in 0.21.3-Beta, PRs #2206
# and #2225 unmerged. Not VS Code-specific: AppleWindowTabbingMode is `always`
# here, so any native-tab app hits it (Finder is AeroSpace#489).
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.microsoft.VSCode'
run = [
  'move-node-to-workspace 3',
  'layout floating',
]

# Workspace 4: Communication — tiled
[[on-window-detected]]
if = '''
test %{app-bundle-id} = com.readdle.SparkDesktop \
  || test %{app-bundle-id} = com.spotify.client \
  || test %{app-bundle-id} = ru.keepcoder.Telegram \
  || test %{app-bundle-id} = net.whatsapp.WhatsApp \
  || test %{app-bundle-id} = com.automattic.beeper.desktop \
  || test %{app-bundle-id} = com.flexibits.fantastical2.mac
'''
run = 'move-node-to-workspace 4'

# Workspace 5: Gaming — floating and centered
[[on-window-detected]]
if = '''
test %{app-bundle-id} = com.valvesoftware.steam \
  || test %{app-bundle-id} = com.valvesoftware.steam.helper
'''
run = [
  'move-node-to-workspace 5',
  'layout floating',
  'exec-and-forget ~/.config/aerospace/scripts/place-window.sh center',
]

# Browsers that are not Helium: parked in workspace 1, floating.
[[on-window-detected]]
if = '''
test %{app-bundle-id} = com.apple.Safari \
  || test %{app-bundle-id} = com.google.Chrome \
  || test %{app-bundle-id} = com.brave.Browser.origin
'''
run = [
  'move-node-to-workspace 1',
  'layout floating',
  'exec-and-forget ~/.config/aerospace/scripts/place-window.sh center',
]

# Terminals that are not Ghostty: parked in workspace 1, floating.
[[on-window-detected]]
if = '''
test %{app-bundle-id} = com.apple.Terminal \
  || test %{app-bundle-id} = com.googlecode.iterm2
'''
run = [
  'move-node-to-workspace 1',
  'layout floating',
  'exec-and-forget ~/.config/aerospace/scripts/place-window.sh center',
]

# Everything else: float, centered, on whichever workspace is already focused.
[[on-window-detected]]
if = 'true'
run = [
  'layout floating',
  'exec-and-forget ~/.config/aerospace/scripts/place-window.sh center',
]
