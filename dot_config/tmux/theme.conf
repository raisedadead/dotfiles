# Catppuccin Mocha palette
set -g @clr_rosewater "#f5e0dc"
set -g @clr_flamingo "#f2cdcd"
set -g @clr_pink "#f5c2e7"
set -g @clr_mauve "#cba6f7"
set -g @clr_red "#f38ba8"
set -g @clr_maroon "#eba0ac"
set -g @clr_peach "#fab387"
set -g @clr_yellow "#f9e2af"
set -g @clr_green "#a6e3a1"
set -g @clr_teal "#94e2d5"
set -g @clr_sky "#89dceb"
set -g @clr_sapphire "#74c7ec"
set -g @clr_blue "#89b4fa"
set -g @clr_lavender "#b4befe"
set -g @clr_text "#cdd6f4"
set -g @clr_subtext1 "#bac2de"
set -g @clr_subtext0 "#a6adc8"
set -g @clr_overlay2 "#9399b2"
set -g @clr_overlay1 "#7f849c"
set -g @clr_overlay0 "#6c7086"
set -g @clr_surface2 "#585b70"
set -g @clr_surface1 "#45475a"
set -g @clr_surface0 "#313244"
set -g @clr_base "#1e1e2e"
set -g @clr_mantle "#181825"
set -g @clr_crust "#11111b"

# Borders and messages
# Style options are format-expanded per-pane at draw time, so @clr_* resolves
# live without a shell fork, and pane-active-border-style can be a live format:
# mauve in copy-mode, red when synchronized, sapphire otherwise — no hook needed
# to recolour on mode/sync change (tmux redraws borders on those transitions).
set -g pane-border-style "fg=#{@clr_surface2}"
set -g pane-active-border-style "fg=#{?pane_in_mode,#{@clr_mauve},#{?pane_synchronized,#{@clr_red},#{@clr_sapphire}}}"
set -g window-style "fg=#{@clr_overlay1}"
set -g window-active-style "fg=#{@clr_text}"
set -g mode-style "bg=#{@clr_surface2},fg=#{@clr_text}"

# Reconcile every window on reload (one fork, config-load only). Clear any
# window-local border colour a sync toggle left behind — no global set reaches a
# window option — then set pane-border-status on the same three-way condition the
# hooks below use. Pane count alone dropped the row for a single pane in copy-mode.
# The -F string MUST double every `#`: run-shell format-expands its own argument
# first, so the bare form reaches list-windows as one literal already resolved
# against the CURRENT window, and every row comes back identical.
run-shell '
  for W in $(tmux list-windows -a -F "##{window_id}:##{window_panes}:##{pane_in_mode}:##{pane_synchronized}"); do
    ID="${W%%:*}"; REST="${W#*:}"; P="${REST%%:*}"; REST="${REST#*:}"
    M="${REST%%:*}"; S="${REST#*:}"
    tmux set -uw -t "$ID" pane-active-border-style
    if [ "$P" -gt 1 ] || [ "$M" = 1 ] || [ "$S" = 1 ]; then
      tmux set -t "$ID" pane-border-status top
    else
      tmux set -u -t "$ID" pane-border-status
    fi
  done
'
set -g pane-border-indicators off
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-format "#[bg=#{@clr_surface0}#,fg=#{?pane_in_mode,#{@clr_mauve},#{?pane_synchronized,#{@clr_red},#{?pane_active,#{@clr_sapphire},#{@clr_subtext0}}}}] #{pane_index} #{?pane_synchronized,SYNC ,}#{?#{==:#{pane_mode},copy-mode},COPY #{scroll_position}/#{history_size},#{?pane_in_mode,#{q/h:pane_mode},#{q/h:#{b:pane_current_path}} (#{q/h:#{E:@cmd_name}})}} #[default]"
# Border colour/lines are global now; these hooks only flip the pane-border-status
# row so copy-mode/synchronized/multi-pane windows show it. top when in-mode OR
# synchronized OR >1 pane, else off. Kept shell-based (not `if -F`) because the
# format context of `run` tracks the hook's own window; `if -F` resolves against
# the client-current window and mis-targets on kill-pane.
set-hook -g pane-mode-changed "run 'W=#{window_id}; want=off; if [ #{pane_in_mode} -eq 1 ] || [ #{pane_synchronized} -eq 1 ] || [ #{window_panes} -gt 1 ]; then want=top; fi; tmux set -t \$W pane-border-status \$want'"
# No guard: setting pane-border-status does not re-fire this hook (verified, tmux
# 3.x — one fire per layout op), so the old show-options round-trip was dead weight.
set-hook -g window-layout-changed "run 'W=#{window_id}; want=off; if [ #{pane_in_mode} -eq 1 ] || [ #{pane_synchronized} -eq 1 ] || [ #{window_panes} -gt 1 ]; then want=top; fi; tmux set -t \$W pane-border-status \$want'"
# Popup border matches the fzf borders in the SIBLING popups (border:#6C7086,
# colors.sh:19) — not the pane borders, which are darker at @clr_surface2.
# `fg=white` drew a brighter grey than the frame it wraps. No display-popup
# wraps an fzf border any more: M-? was the last, and it is now -b none.
set -g popup-border-style "fg=#{@clr_overlay0}"
# Menus: these three OPTIONS are format-expanded, unlike the per-command
# display-menu -s/-S/-H arguments, which are passed straight to style_parse and
# take a literal colour only. Setting them here themes every menu on the server
# — session-menu.sh, unpark-session.sh, the M-; menu and tmux's own right-click
# menus — from one palette, and lets all three call sites drop their -s/-S/-H
# copies. Probed with a recorded client: the border emits 38;2;108;112;134 and
# the selected row 48;2;203;166;247.
set -g menu-style "fg=#{@clr_text},bg=#{@clr_crust}"
set -g menu-selected-style "fg=#{@clr_base},bg=#{@clr_mauve},bold"
set -g menu-border-style "fg=#{@clr_overlay0}"
# Crust, so a display-popup matches the two neighbours that already paint it:
# every fzf popup (bg:#11111B, colors.sh:16) and every menu (menu-style above).
# The HUE was never the difference — `ghostty +show-config` reports
# `background = #11111b`, the same crust. Opacity was: an unpainted cell shows
# `background-opacity = 0.9` and `background-blur`, a painted one is opaque, and
# `background-opacity-cells` is left at its default false. This therefore trades
# the glass on M-t, M-g, reader.sh:84 and the prompt.sh popups for one surface.
set -g popup-style "bg=#{@clr_crust},fg=#{@clr_text}"
set -g message-style "bg=#{@clr_yellow},fg=#{@clr_crust}"
set -g message-command-style "bg=#{@clr_sky},fg=#{@clr_crust}"
set -g copy-mode-position-format ''

# Status bar — native tmux options, one row.
# `set -gu status-format` is load-bearing: source-file never removes an option,
# so without it a live prefix+r keeps whatever bar the server already has.
# Neither window-status format carries an inline #[fg=]: an inline colour is
# applied last and would mask window-status-activity-style and -bell-style.
# Row 1 is an empty spacer, so the bar does not touch the first pane border.
# `set -gu status-format` must stay ABOVE it, or the unset wipes the spacer too.
# status-left is empty on purpose: the right-hand tile already names the current
# session, and it carries the prefix indicator — green normally, red while held.
# BOTH #{S:} branches filter @parked — park-session.sh:17 sets the flag before it
# switches the client away, so a parked session can be the current one.
# The ROW is bg=default so it keeps Ghostty's opacity and blur, like a pane.
# Each item carries its own bg, or the text has no contrast to read against.
# Every name goes through #{q/h:}, which doubles a `#`. A window or session named
# with a literal `#[fg=red]` otherwise injects that style into the drawn row.
set -g status 2
set -gu status-format
set -g status-format[1] ""
set -g status-justify left
set -g status-style "bg=default,fg=#{@clr_overlay2}"
set -g status-right-length 100
set -g status-left ""
set -g window-status-separator " "
set -g window-status-style "fg=#{@clr_subtext0},bg=#{@clr_surface0}"
set -g window-status-current-style "fg=#{@clr_crust},bg=#{@clr_mauve},bold"
set -g window-status-activity-style "fg=#{@clr_yellow},bg=#{@clr_surface0}"
set -g window-status-bell-style "fg=#{@clr_red},bg=#{@clr_surface0},bold"
set -g window-status-format " #{window_index}:#{q/h:window_name}#{?#{>:#{window_panes},1},(#{window_panes}),}#{window_flags} "
set -g window-status-current-format " #{window_index}:#{q/h:window_name}#{?#{>:#{window_panes},1},(#{window_panes}),}#{window_flags} "
set -g status-right "#{S:#{?#{==:#{@parked},1},,#[fg=#{@clr_subtext0}#,bg=#{@clr_surface0}] #{=/10/…:#{q/h:session_name}}(#{session_windows}) #[default] },#{?#{==:#{@parked},1},,#[fg=#{@clr_crust}#,bg=#{?client_prefix,#{@clr_red},#{@clr_green}}#,bold] #{=/10/…:#{q/h:session_name}}(#{session_windows}) #[default] }}"
