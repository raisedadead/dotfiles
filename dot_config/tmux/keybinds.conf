# Unbind defaults that conflict with custom bindings or cause accidental triggers.
# Re-enable any by removing the unbind line and reloading (prefix+r).
#
# Dangerous: prefix + Space double-tap fires next-layout
unbind Space
#
# Repeatable arrow defaults extend the prefix intercept window (ghost inputs)
unbind Up           # select-pane -U      → use prefix+k
unbind Down         # select-pane -D      → use prefix+j
unbind Left         # select-pane -L      → use prefix+h
unbind Right        # select-pane -R      → use prefix+l
unbind M-Up         # resize-pane -U 5    → use prefix+K
unbind M-Down       # resize-pane -D 5    → use prefix+J
unbind M-Left       # resize-pane -L 5    → use prefix+H
unbind M-Right      # resize-pane -R 5    → use prefix+L
unbind C-Up         # resize-pane -U 1    → use prefix+K
unbind C-Down       # resize-pane -D 1    → use prefix+J
unbind C-Left       # resize-pane -L 1    → use prefix+H
unbind C-Right      # resize-pane -R 1    → use prefix+L
unbind S-Up         # refresh-client -U 10
unbind S-Down       # refresh-client -D 10
unbind S-Left       # refresh-client -L 10
unbind S-Right      # refresh-client -R 10
unbind DC           # refresh-client -c
#
# Duplicates replaced by custom root (Alt) or prefix bindings
unbind '"'          # split-window        → prefix+- or M-S-D/M-D
unbind %            # split-window -h     → prefix+| or M-d
unbind z            # resize-pane -Z      → prefix+f or M-S-Enter
unbind n            # next-window         → M-`
unbind p            # previous-window     → M-S-~/M-~
unbind '['          # copy-mode           → M-v
unbind ','          # rename-window       → M-R
unbind '$'          # rename-session      → M-r
unbind '('          # switch-client -p    → M-BTab
unbind ')'          # switch-client -n    → M-Tab
unbind 0            # select-window :=0   → unused (base-index is 1)
unbind '!'          # break-pane          → M-; → 2

# Seamless navigation: neovim splits + tmux panes (via smart-splits.nvim)
# When @pane-is-vim is set, forward keys to neovim; otherwise tmux handles them
#
# -N notes are the descriptions `keys` reads back out (tmux list-keys -N).
# Keep one on every binding worth remembering: it is the only place a label
# for it lives, and it cannot drift from the binding it sits on.
bind-key -n -N "Navigate left" M-H   if -F "#{@pane-is-vim}" "send-keys M-H"   "select-pane -L"
bind-key -n -N "Navigate left (CSI u)" M-S-H if -F "#{@pane-is-vim}" "send-keys M-S-H" "select-pane -L"
bind-key -n -N "Navigate down" M-J   if -F "#{@pane-is-vim}" "send-keys M-J"   "select-pane -D"
bind-key -n -N "Navigate down (CSI u)" M-S-J if -F "#{@pane-is-vim}" "send-keys M-S-J" "select-pane -D"
bind-key -n -N "Navigate up" M-K   if -F "#{@pane-is-vim}" "send-keys M-K"   "select-pane -U"
bind-key -n -N "Navigate up (CSI u)" M-S-K if -F "#{@pane-is-vim}" "send-keys M-S-K" "select-pane -U"
bind-key -n -N "Navigate right" M-L   if -F "#{@pane-is-vim}" "send-keys M-L"   "select-pane -R"
bind-key -n -N "Navigate right (CSI u)" M-S-L if -F "#{@pane-is-vim}" "send-keys M-S-L" "select-pane -R"

# Ctrl+Shift word/line editing — same @pane-is-vim arbitration as above.
# No terminal can distinguish Ctrl+Shift+X from Ctrl+X (one control byte
# either way), so config.ghostty rewrites the four to ESC + that byte, which
# lands here as M-C-x. Vim panes get the plain Ctrl+X back so neovim keeps
# native Ctrl+X semantics instead of a stray <Esc> prefix — mode-scoped, not
# blanket protection: it saves insert mode (<C-a> = i_CTRL-A, not Esc-then-
# increment) but normal mode increments either way. Every other pane gets
# M-C-x, which .zshrc binds.
bind-key -n -N "Delete word backward (zsh) / C-w (vim)" M-C-w if -F "#{@pane-is-vim}" "send-keys C-w" "send-keys M-C-w"
bind-key -n -N "Accept suggestion word (zsh) / C-e (vim)" M-C-e if -F "#{@pane-is-vim}" "send-keys C-e" "send-keys M-C-e"
bind-key -n -N "Jump word back (zsh) / C-a (vim)" M-C-a if -F "#{@pane-is-vim}" "send-keys C-a" "send-keys M-C-a"
bind-key -n -N "Jump word forward (zsh) / C-s (vim)" M-C-s if -F "#{@pane-is-vim}" "send-keys C-s" "send-keys M-C-s"

# Pane navigation (prefix fallback)
bind -N "Pane left" h select-pane -L
bind -N "Pane down" j select-pane -D
bind -N "Pane up" k select-pane -U
bind -N "Pane right" l select-pane -R

# Pane resize (prefix, repeatable)
bind -r -N "Resize left" H resize-pane -L 2
bind -r -N "Resize down" J resize-pane -D 2
bind -r -N "Resize up" K resize-pane -U 2
bind -r -N "Resize right" L resize-pane -R 2

# Splits and windows (prefix-free)
#
# Dual bindings: M-S-X (CSI u / extended-keys) + M-X (legacy encoding).
# Alt+Shift+D sends \eD (legacy) or \e[68;4u (CSI u) depending on terminal
# mode. tmux matches M-D for the former, M-S-D for the latter. Binding both
# ensures the key works regardless of encoding mode, Ghostty version, or
# whether an inner app has requested extended keys.
# See: Ghostty #9406 (Option encoding in modifyOtherKeys mode 2)
bind -n -N "Split right" M-d split-window -h -c "#{pane_current_path}"
bind -n -N "Split down (CSI u)" M-S-D split-window -v -c "#{pane_current_path}"
bind -n -N "Split down" M-D   split-window -v -c "#{pane_current_path}"
bind -n -N "New window (prompt)" M-m display-popup -E -w 20% -h 5 -b rounded -T '#[align=centre] New Window ' "~/.config/tmux/scripts/new-window-popup.sh"
bind -n -N "Zoom pane" M-S-Enter resize-pane -Z

# Splits (prefix, preserve cwd)
bind -N "Split right" | split-window -h -c "#{pane_current_path}"
bind -N "Split down" - split-window -v -c "#{pane_current_path}"

# Equalize layouts (prefix only)
bind -N "Equalize vertical" e select-layout even-vertical
bind -N "Equalize horizontal" E select-layout even-horizontal

# Window cycling (dual: CSI u + legacy — see splits comment above)
bind -n -N "Next window" M-` next-window
bind -n -N "Previous window (CSI u)" M-S-~ previous-window
bind -n -N "Previous window" M-~   previous-window

# Rename (prefix-free, popup; dual: CSI u + legacy — see splits comment above)
bind -n -N "Rename session" M-r display-popup -E -w 20% -h 5 -b rounded -T '#[align=centre] Rename Session ' "~/.config/tmux/scripts/rename-popup.sh session"
bind -n -N "Rename window (CSI u)" M-S-R display-popup -E -w 20% -h 5 -b rounded -T '#[align=centre] Rename Window ' "~/.config/tmux/scripts/rename-popup.sh window"
bind -n -N "Rename window" M-R   display-popup -E -w 20% -h 5 -b rounded -T '#[align=centre] Rename Window ' "~/.config/tmux/scripts/rename-popup.sh window"

# Direct window access (Alt+1..9)
bind -n -N "Select window 1" M-1 select-window -t :1
bind -n -N "Select window 2" M-2 select-window -t :2
bind -n -N "Select window 3" M-3 select-window -t :3
bind -n -N "Select window 4" M-4 select-window -t :4
bind -n -N "Select window 5" M-5 select-window -t :5
bind -n -N "Select window 6" M-6 select-window -t :6
bind -n -N "Select window 7" M-7 select-window -t :7
bind -n -N "Select window 8" M-8 select-window -t :8
bind -n -N "Select window 9" M-9 select-window -t :9

# Actions
bind -N "Kill pane (confirm)" x confirm-before -y -p "Kill pane? (Enter/n)" kill-pane
bind -N "Zoom pane" f resize-pane -Z
# Sync-panes toggle delegates to a script so the border colour reflects
# the POST-toggle state. Inline `setw ... \; run '... #{pane_synchronized} ...'`
# fails because tmux format-expands the whole command list at parse time,
# before `setw` has flipped the option (red stays after toggling off).
bind -N "Sync panes" i run-shell "~/.config/tmux/scripts/toggle-sync-panes.sh '#{window_id}' '#{@clr_red}' '#{@clr_sapphire}'"
bind -N "Reload config" r source-file ~/.config/tmux/tmux.conf \; display 'Tmux config reloaded'

# SimpleMenu (fzf-powered switcher)
bind -n -N "Session switcher" M-o run-shell "$HOME/.config/tmux/scripts/switcher.sh || true"
bind -n -N "Next session" M-Tab run-shell "$HOME/.config/tmux/scripts/cycle-session.sh -n"
bind -n -N "Previous session" M-BTab run-shell "$HOME/.config/tmux/scripts/cycle-session.sh -p"
bind -n -N "New session (prompt)" M-n display-popup -E -w 20% -h 5 -b rounded -T '#[align=centre] New Session ' "~/.config/tmux/scripts/new-session-popup.sh"

# Tree view (sessions + windows)
bind -n -N "Choose tree (sessions + windows)" M-w choose-tree -Zw -F "#{?pane_format,#{pane_current_command} #{pane_current_path},#{?window_format,#{window_name} (#{window_panes} panes),#{session_name} (#{session_windows} win)}}"

# Popups
bind -n -N "Session menu" M-s run-shell "$HOME/.config/tmux/scripts/session-menu.sh || true"
bind -n -N "Scratch terminal" M-t display-popup -E -w 56% -h 64% -b rounded -T '#[align=centre] Scratch ' -d "#{pane_current_path}"
bind -n -N "Lazygit" M-g display-popup -E -w 70% -h 80% -b rounded -T '#[align=centre] Lazygit ' -d "#{pane_current_path}" lazygit
# Reader — fzf picker over the pane cwd, glow for markdown, bat for the rest.
# Three switcher-style tabs: Docs (Ctrl+D, markdown, default), Files (Ctrl+F),
# Scratch (Ctrl+S, .scratchpad/ + .claude/ with .gitignore overridden).
# The script restates every renderer flag; ~/.config/bat/config is tuned for
# non-interactive use and both tools drop colour off a tty. See the script head.
# -EE, not -E: -E closes the popup the instant the command exits, including on
# failure, so a glow or bat error flashes past unread. -EE closes on success
# only, and Esc still exits 0, so cancelling still auto-closes.
bind -n -N "Reader (docs/files/scratch)" M-i display-popup -EE -w 80% -h 80% -b rounded -T '#[align=centre] Reader ' -d "#{pane_current_path}" "~/.config/tmux/scripts/read-popup.sh"
bind -n -N "Park session" M-p run-shell "$HOME/.config/tmux/scripts/park-session.sh || true"
bind -n -N "Unpark session" M-u run-shell "$HOME/.config/tmux/scripts/unpark-session.sh || true"
# Keybindings cheatsheet — `keys` generates every row from each tool's own
# reporting at run time. Runs standalone outside tmux too; the popup is only a
# frame around it, so there is one implementation, not two.
bind -n -N "Keybindings" 'M-?' display-popup -E -w 80% -h 80% -b rounded -T '#[align=centre] Keybindings ' "$HOME/.bin/keys"
# URL Picker entry below invokes tmux-fzf-url plugin internals (fzf-url.sh argv).
# Plugin also auto-binds `prefix u` for the same picker — more discoverable.
# M-; not M-\: ESC-backslash is the ST terminator ending every DCS reply;
# passthrough query replies (yazi startup probes) would fire the menu.
# workaround: tmux/tmux#4386 (wontfix upstream), sxyazi/yazi#3997
bind -n -N "Command menu" 'M-;' display-menu -T '#[align=centre] Commands ' \
  -b rounded \
  -s 'fg=#cdd6f4,bg=#1e1e2e' \
  -S 'fg=#6c7086' \
  -H 'fg=#1e1e2e,bg=#cba6f7,bold' \
  -x C -y C \
  "Sync Panes"           1 "run-shell '~/.config/tmux/scripts/toggle-sync-panes.sh \"#{window_id}\" \"#{@clr_red}\" \"#{@clr_sapphire}\"'" \
  "Break to Window"      2 "break-pane" \
  "Break to Session"     3 "display-popup -E -w 20% -h 5 -b rounded -T '#[align=centre] Break to Session ' '~/.config/tmux/scripts/break-pane-to-session-popup.sh'" \
  "Equalize Vertical"    4 "select-layout even-vertical" \
  "Equalize Horizontal"  5 "select-layout even-horizontal" \
  "Scratch Terminal"     6 "display-popup -E -w 56% -h 64% -b rounded -T '#[align=centre] Scratch ' -d '#{pane_current_path}'" \
  "" \
  "URL Picker"           0 "run-shell -b '~/.config/tmux/plugins/tmux-fzf-url/fzf-url.sh \"\" 2000 \"open\" \"\"'" \
  "New Window"           w "new-window -c '#{pane_current_path}'" \
  "Last Session"         l "switch-client -l" \
  "" \
  "Command Prompt"       : "command-prompt"
