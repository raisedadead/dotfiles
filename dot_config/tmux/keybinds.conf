# Vanilla tmux 3.8 keys plus these deviations, all behind the C-Space prefix
# (tmux.conf). No root (prefix-free) binding: Alt keys stay with the shell.
# A reload keeps a removed binding live; restart the server after a change here.
#
# -N notes are the descriptions `keys` reads back out (tmux list-keys -N).
# Keep one on every binding: it is the only place its label lives.

# prefix + Space double-tap would fire next-layout.
unbind Space

# Pane navigation (h/j/k/l; vanilla l was last-window, L stays last session)
bind -N "Pane left" h select-pane -L
bind -N "Pane down" j select-pane -D
bind -N "Pane up" k select-pane -U
bind -N "Pane right" l select-pane -R

# Scratch: vanilla Tab makes an empty float; this one is a shell in the
# pane's folder.
bind -N "Scratch shell (float)" Tab new-pane -c "#{pane_current_path}" -X 0 -Y 0 -x "75%" -y "30%" \; move-pane -P bottom

# Special panes
bind -N "Session switcher" o run-shell -b "$HOME/.config/tmux/scripts/run.sh switcher"
bind -N "Lazygit" g display-popup -E -w 70% -h 80% -b rounded -T '#[align=centre] Lazygit ' -d "#{pane_current_path}" lazygit
# Reader: `mdr` owns the rows, the preview and the pager; the tab switcher
# (All, Docs, Scratch, Files) lives in reader.sh.
bind -N "Reader (all/docs/scratch/files)" r run-shell -b "cd #{q:pane_current_path} || exit 0; $HOME/.config/tmux/scripts/run.sh reader.sh"
# URL picker: argv is tmux-fzf-url's internal contract (fzf-url.tmux:30): extra
# filter, history limit, open command, copy command. The plugin also binds its
# own prefix u.
bind -N "URL picker" e run-shell -b "$HOME/.config/tmux/scripts/run.sh $HOME/.config/tmux/plugins/tmux-fzf-url/fzf-url.sh '' '#{@fzf-url-history-limit}' '#{@fzf-url-open}' '#{@fzf-url-copy-cmd}'"

# Actions menu. Sync panes goes through a script so pane-border-status shows
# the state after the toggle: tmux expands a command list's formats at parse
# time, before `setw` flips the option.
bind -N "Actions menu" A display-menu -T '#[align=centre] Actions ' \
  -b rounded \
  -x C -y C \
  "Park Session"         p "run-shell '$HOME/.config/tmux/scripts/run.sh park-session.sh'" \
  "Unpark Session"       u "run-shell -b '$HOME/.config/tmux/scripts/run.sh unpark-session.sh'" \
  "Break to Session"     s "display-popup -E -w 20% -h 5 -b rounded -T '#[align=centre] Break to Session ' '~/.config/tmux/scripts/prompt.sh break-session'" \
  "Break to Window"      w "break-pane" \
  "Sync Panes"           y "run-shell '$HOME/.config/tmux/scripts/run.sh toggle-sync-panes.sh #{q:window_id}'" \
  "" \
  "Reload Config"        r "source-file ~/.config/tmux/tmux.conf ; display 'Tmux config reloaded'" \
  "Command Prompt"       : "command-prompt"
