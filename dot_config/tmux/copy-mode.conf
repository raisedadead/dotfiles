# -N notes are what `keys` reads back out as descriptions — see keybinds.conf.

# Toggle copy mode
bind -n -N "Toggle copy mode" M-v if -F "#{pane_in_mode}" "send-keys -X cancel" "copy-mode"

# Vi selection
bind -T copy-mode-vi -N "Begin selection" v send-keys -X begin-selection
bind -T copy-mode-vi -N "Rectangle toggle" C-v send-keys -X rectangle-toggle
# y → handled by tmux-yank plugin (copy-pipe-and-cancel pbcopy)

# Pane navigation (smart-splits)
bind -T copy-mode-vi -N "Navigate left" M-H select-pane -L
bind -T copy-mode-vi -N "Navigate left (CSI u)" M-S-H select-pane -L
bind -T copy-mode-vi -N "Navigate down" M-J select-pane -D
bind -T copy-mode-vi -N "Navigate down (CSI u)" M-S-J select-pane -D
bind -T copy-mode-vi -N "Navigate up" M-K select-pane -U
bind -T copy-mode-vi -N "Navigate up (CSI u)" M-S-K select-pane -U
bind -T copy-mode-vi -N "Navigate right" M-L select-pane -R
bind -T copy-mode-vi -N "Navigate right (CSI u)" M-S-L select-pane -R

# Mouse: pane-aware selection, copies to system clipboard via OSC 52
bind -T copy-mode-vi -N "Select text (pane-aware, auto-copies)" MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode-vi -N "Select word (auto-copies)" DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection
bind -T copy-mode-vi -N "Select line (auto-copies)" TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection

# Scroll: auto-exit copy mode when reaching bottom
bind -T copy-mode-vi -N "Scroll up" WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi -N "Scroll down (auto-exits at bottom)" WheelDownPane send-keys -X scroll-down \; if -F "#{scroll_position}" "" "send-keys -X cancel"
