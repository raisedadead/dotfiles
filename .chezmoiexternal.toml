# Every external is PINNED. Nothing here refreshes on its own.
# refreshPeriod = "0" stops the automatic fetch. A checksum makes chezmoi
# refuse a file whose bytes changed. Bump a pin deliberately: fetch the new
# artefact, read it, then write the new sha256 here.

[".config/tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm.git"
    refreshPeriod = "0"
    [".config/tmux/plugins/tpm".clone]
        args = ["--branch", "v3.1.0", "--depth", "1"]

["Library/Fonts/sketchybar-app-font.ttf"]
    type = "file"
    url = "https://github.com/kvndrsslr/sketchybar-app-font/releases/download/v3.0.5/sketchybar-app-font.ttf"
    refreshPeriod = "0"
    ["Library/Fonts/sketchybar-app-font.ttf".checksum]
        sha256 = "4abab88e1886f698be435086ce0cd30fa5232111c54079d7d2447c67ca11aecb"

# sketchybar EXECUTES this file as Lua. The checksum is the control that stops
# an upstream change running here unread.
[".config/sketchybar/lua/icon_map.lua"]
    type = "file"
    url = "https://github.com/kvndrsslr/sketchybar-app-font/releases/download/v3.0.5/icon_map.lua"
    refreshPeriod = "0"
    [".config/sketchybar/lua/icon_map.lua".checksum]
        sha256 = "b4180f13cb26b03e3cb09e554c5406f527b49ebdf31aba43ffa724c99f4e715b"
